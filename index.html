<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#121213">
  <title>Wordle Upgrade</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <div class="game-container">
    <header>
      <h1>Wordle Upgrade</h1>
      <div class="user-display-container">
        <span id="user-display">Not logged in</span>
        <button id="login-button" type="button">Login</button>
        <button id="logout-button" type="button" style="display: none;">Logout</button>
      </div>
    </header>

    <div id="mode-indicator">Current Mode: Daily</div>

    <nav class="mode-selection" aria-label="Game modes">
      <button id="daily-mode-button" type="button">Word of the Day</button>
      <button id="random-mode-button" type="button">Random Word</button>
      <button id="six-letter-mode-button" type="button">6-Letter Word</button>
      <button id="view-leaderboard" type="button">Leaderboard</button>
      <button id="view-achievements" type="button">Achievements</button>
      <button id="open-feedback" type="button">Feedback</button>
    </nav>

    <main role="main">
      <div id="game-board" aria-label="Game board"></div>
      <div id="keyboard" aria-label="On-screen keyboard"></div>
      <section id="statistics">
        <h2>Your Statistics</h2>
        <div id="streak-counter">Current Streak: 0</div>
        <canvas id="stats-chart" aria-label="Statistics chart"></canvas>
      </section>
    </main>
  </div>

  <div id="toast-container" role="status" aria-live="polite"></div>

  <div id="name-modal" class="modal" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-labelledby="name-modal-title" aria-modal="true">
      <button class="close" aria-label="Close" type="button">&times;</button>
      <h2 id="name-modal-title">Enter Your Name</h2>
      <input type="text" id="player-name-input" placeholder="Player Name" maxlength="20" autocomplete="nickname">
      <button id="save-name-button" type="button">Save</button>
    </div>
  </div>

  <div id="leaderboard-modal" class="modal" aria-hidden="true">
    <div class="modal-content modal-wide" role="dialog" aria-labelledby="leaderboard-modal-title" aria-modal="true">
      <button class="close" aria-label="Close" type="button">&times;</button>
      <h2 id="leaderboard-modal-title">Leaderboard</h2>
      <div class="tabs" role="tablist">
        <button class="tablink active" type="button" data-tab="leaderboard-daily" role="tab">Daily</button>
        <button class="tablink" type="button" data-tab="leaderboard-random" role="tab">Random</button>
        <button class="tablink" type="button" data-tab="leaderboard-six-letter" role="tab">6-Letter</button>
      </div>
      <label class="leaderboard-filter">
        Filter by date:
        <input type="date" id="leaderboard-date">
      </label>
      <div id="leaderboard-daily" class="tabcontent active"></div>
      <div id="leaderboard-random" class="tabcontent"></div>
      <div id="leaderboard-six-letter" class="tabcontent"></div>
    </div>
  </div>

  <div id="daily-attempt-modal" class="modal" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-labelledby="daily-attempt-modal-title" aria-modal="true">
      <button class="close" aria-label="Close" type="button">&times;</button>
      <h2 id="daily-attempt-modal-title">Daily Word Already Played</h2>
      <div id="daily-attempt-content"></div>
    </div>
  </div>

  <div id="feedback-modal" class="modal" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-labelledby="feedback-modal-title" aria-modal="true">
      <button class="close" aria-label="Close" type="button">&times;</button>
      <h2 id="feedback-modal-title">Feedback</h2>
      <textarea id="feedback-text" placeholder="What's on your mind?" maxlength="2000"></textarea>
      <button id="submit-feedback" type="button">Submit</button>
    </div>
  </div>

  <div id="winning-modal" class="modal" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-labelledby="winning-modal-title" aria-modal="true">
      <button class="close" aria-label="Close" type="button">&times;</button>
      <h2 id="winning-modal-title">Congratulations!</h2>
      <h3 id="winning-word-display"></h3>
      <div id="word-definition"></div>
      <div class="share-buttons">
        <button id="copy-result-button" type="button">Copy Result</button>
        <button id="share-whatsapp-button" type="button">WhatsApp</button>
        <button id="share-button" type="button">Twitter</button>
      </div>
      <canvas id="confetti-canvas" aria-hidden="true"></canvas>
    </div>
  </div>

  <div id="auth-modal" class="modal" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-labelledby="auth-modal-title" aria-modal="true">
      <button class="close" aria-label="Close" type="button">&times;</button>
      <h2 id="auth-modal-title">Login / Sign Up</h2>
      <button id="email-signin-button" type="button">Sign in with Email</button>
      <button id="email-signup-button" type="button">Sign up with Email</button>
    </div>
  </div>

  <div id="email-auth-modal" class="modal" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-labelledby="email-auth-title" aria-modal="true">
      <button class="close" aria-label="Close" type="button">&times;</button>
      <h2 id="email-auth-title">Email Authentication</h2>
      <input type="email" id="user-email" placeholder="Email" autocomplete="email">
      <input type="password" id="user-password" placeholder="Password (6+ characters)" autocomplete="current-password" minlength="6">
      <button id="email-auth-submit" type="button">Continue</button>
    </div>
  </div>

  <div id="achievements-modal" class="modal" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-labelledby="achievements-modal-title" aria-modal="true">
      <button class="close" aria-label="Close" type="button">&times;</button>
      <h2 id="achievements-modal-title">Achievements</h2>
      <ul id="achievements-list"></ul>
    </div>
  </div>
</body>
</html>
